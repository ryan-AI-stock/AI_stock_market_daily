name: 每日股市訊號分析

on:
  schedule:
    # 台灣平日 15:00-23:00 每小時喚醒；共用交易日規則會再排除
    # 國定假日、颱風停市及其他非交易日。
    - cron: '0 7-15 * * 1-5'
  workflow_dispatch:          # 允許手動在網頁上觸發
    inputs:
      force_run:
        description: '手動 Action 永遠強制重新產生；此欄位僅保留相容性'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      validation_folder_id:
        description: '僅上傳驗收版 PDF 至此 Google Drive 資料夾 ID；不更新正式報告或寄信'
        required: false
        default: ''
        type: string
      report_date:
        description: '精確補跑日期，YYYY-MM-DD；有指定時禁止回退到較舊資料日'
        required: false
        default: ''
        type: string

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 取得共用排程規則
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: schedule_rules

      - name: 檢查交易日排程
        id: schedule-gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch_bypass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=schedule_rules python -m stock_schedule_rules.gate --profile daily --github-output "$GITHUB_OUTPUT"

      - name: 略過非交易日排程
        if: github.event_name == 'schedule' && steps.schedule-gate.outputs.should_run != 'true'
        run: echo "Schedule gate skipped this run. reason=${{ steps.schedule-gate.outputs.reason }}"

      - name: 安裝套件
        if: github.event_name == 'workflow_dispatch' || steps.schedule-gate.outputs.should_run == 'true'
        run: |
          pip install yfinance pandas requests playwright google-api-python-client google-auth
          playwright install --with-deps chromium

      - name: 執行訊號分析
        if: github.event_name == 'workflow_dispatch' || steps.schedule-gate.outputs.should_run == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DAILY_REPORT_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          PUBLIC_REPORT_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          PUBLIC_REPORT_DRIVE_FILE_ID: ""
          # Manual dispatch is always authoritative and must never be blocked by an existing Drive report.
          FORCE_RUN_REPORT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REPORT_VALIDATION_DRIVE_FOLDER_ID: ${{ github.event.inputs.validation_folder_id || '' }}
          REPORT_DATE: ${{ github.event.inputs.report_date || steps.schedule-gate.outputs.target_date || '' }}
        shell: bash
        run: |
          # 資料供應商在收盤後可能延遲：同一次 Action 有限重抓，
          # 不會無限迴圈；全部失敗才交給下一個每小時排程或外部監控。
          for attempt in 1 2 3; do
            set +e
            python stock_market_tracking_system.py
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            if [ "$attempt" -lt 3 ]; then
              wait_minutes=$((attempt * 3))
              echo "目標交易日資料尚未齊（${attempt}/3），${wait_minutes}分鐘後重新下載。"
              sleep $((wait_minutes * 60))
            fi
          done
          echo "::error::三次下載後目標交易日資料仍未齊；未發布舊報告，交由下一排程與外部監控補救。"
          exit 75
