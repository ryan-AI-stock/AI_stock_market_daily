name: 每日股市訊號分析

on:
  schedule:
    # 每小時觸發。程式以台灣時間 15:00 為每日報告週期起點，未成功前持續重試。
    # 任一標的失敗或資料日不符時會在產檔前中止；完整上傳後，同週期檔案檢查會略過後續排程。
    - cron: '0 * * * *'
  workflow_dispatch:          # 允許手動在網頁上觸發
    inputs:
      force_run:
        description: '忽略同日已產出檢查，強制重新產生並寄送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      validation_folder_id:
        description: '僅上傳驗收版 PDF 至此 Google Drive 資料夾 ID；不更新正式報告或寄信'
        required: false
        default: ''
        type: string

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          pip install yfinance pandas requests playwright google-api-python-client google-auth
          playwright install --with-deps chromium

      - name: 執行訊號分析
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DAILY_REPORT_DRIVE_FOLDER_ID: ${{ secrets.DAILY_REPORT_DRIVE_FOLDER_ID }}
          PUBLIC_REPORT_DRIVE_FOLDER_ID: ${{ vars.PUBLIC_REPORT_DRIVE_FOLDER_ID }}
          FORCE_RUN_REPORT: ${{ github.event.inputs.force_run || 'false' }}
          REPORT_VALIDATION_DRIVE_FOLDER_ID: ${{ github.event.inputs.validation_folder_id || '' }}
        run: python stock_market_tracking_system.py
